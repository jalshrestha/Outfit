services:
  postgres:
    image: postgres:15-alpine
    container_name: outfit_postgres
    environment:
      POSTGRES_USER: outfit_user
      POSTGRES_PASSWORD: outfit_password
      POSTGRES_DB: outfit_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U outfit_user -d outfit_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
